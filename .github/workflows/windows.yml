name: Build Windows development package
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
  desktop:
    # The local corpus is excluded from Git until redistribution is resolved.
    # Enable only after documenting permissions for the exact pinned editions.
    if: ${{ vars.FOLIO_LIBRARY_DISTRIBUTION_APPROVED == 'true' }}
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Reconstruct reviewed corpus from the pinned source
        run: python -X utf8 scripts/build_library.py --cache "${{ runner.temp }}/folio-library-cache"
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Folio-Windows-unsigned-development-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
